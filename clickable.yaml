clickable_minimum_required: 8.3.0

# Ubuntu Touch 24.04 (glibc 2.39, arm64). The click bundles an arm64 OpenJDK 21,
# the atlas framework natives and a route-B Gecko, so it is arm64-only.
framework: ubuntu-touch-24.04-1.x
restrict_arch: arm64

builder: custom
build: ${ROOT}/build.sh

# The launcher process to stop on install or redeploy.
kill: android-translation-layer-hotspot

# Almost nothing is built here: atlas and its native chain arrive as the SDK
# tarball atl-touch's CI publishes, and Gecko as the payload tarball. What is
# left is shim.jar (javac), libportshim.so (one C file) and the jlinked JVM.
# The target -dev packages stay: the click bundles every library the device
# does not ship, and they are where those come from.
dependencies_host:
  - ca-certificates-java
  - curl
  - file
  - git
  - openjdk-21-jdk-headless
  - python-is-python3
  # to run the jlinked arm64 java once, for the base CDS archive: jlink's
  # --generate-cds-archive needs the image's own java and this is a cross build
  - qemu-user-static
  - python3
  - rsync
  - unzip
  - xz-utils
  - zip
  - zstd

dependencies_target:
  # atlas: libtranslation_layer_main.so and libandroid.so.0
  - libasound2-dev
  - libavcodec-dev
  - libswscale-dev
  - libdrm-dev
  - libegl-dev
  - libgl-dev
  - libgles-dev
  - libglib2.0-dev
  - libgraphene-1.0-dev
  - libgstreamer1.0-dev
  - libgstreamer-plugins-base1.0-dev
  - libgudev-1.0-dev
  # the SDK's atlas links content-hub, and the device ships Lomiri's fork under
  # a different soname (liblomiri-content-hub.so.1), so this one travels
  - libcontent-hub-glib-dev
  - libportal-dev
  - libsqlite3-dev
  - libvulkan-dev
  - libwayland-dev
  - wayland-protocols
  - libfontconfig-dev
  - libxkbcommon-dev
  - libgbm-dev
  - libicu-dev
  - libopenxr-dev
  # the soft keyboard: atlas's maliit input-method backend is optional in meson,
  # so without this it is silently not built and nothing can be typed
  - libmaliit-glib-dev
  # skia is prebuilt (-Dskia-prebuilt), but its headers pull these in
  - libexpat1-dev
  - libfreetype-dev
  - libharfbuzz-dev
  - libpng-dev
  - libwebp-dev
  - zlib1g-dev
  # the arm64 JVM the click bundles: jni.h and libjvm.so to link the launcher
  # against, and the jmods jlink builds the shipped image from
  - openjdk-21-jdk-headless
