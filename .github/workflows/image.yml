name: Build the native image (arm64)

# A GraalVM native image of Fenix's whole class path, for aarch64.
#
# This job exists because native-image cannot cross-compile, and until GitHub
# rented out arm64 runners there was no aarch64 machine to build it on: the
# phone has no C compiler and 7.2 GB against an 8 GB builder, qemu-user runs the
# builder 38x slower, and Houdini does not finish at all. A 4-core, 16 GB
# ubuntu-24.04-arm runner is exactly the "aarch64 host with ~16 GB and a C
# toolchain" that firefox-atl's jvm-run/image/NOTES.md named as the whole
# remaining cost.
#
# Inputs are the same two tarballs the click build uses, so the image is over
# the same framework and the same class path the HotSpot click ships.

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: "atl-touch SDK release tag (blank = the one build.sh pins)"
        required: false
        default: ""
      payload_tag:
        description: "payload release tag (blank = the one build.sh pins)"
        required: false
        default: ""
      stub_only:
        description: "build only the one-class stub image (a ~1 min toolchain check)"
        type: boolean
        default: false
      publish:
        description: "publish the image as a release asset"
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - "image/**"
      - ".github/workflows/image.yml"

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GRAALVM_VERSION: "21.0.2"
      IMG_XMX: "10g"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost || true
          df -h /
          echo "cpus: $(nproc), memory:"; free -g

      # native-image links the image with the system toolchain, so a C compiler
      # and zlib's headers are not optional -- this is the exact pair the phone
      # does not have.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential zlib1g-dev zstd unzip curl file

      - name: Resolve the pinned inputs
        id: pins
        run: |
          eval "$(grep -E '^FENIX_(SDK|PAYLOAD)_(TAG|SHA256)=|^FENIX_(SDK|ASSET)_REPO=' build.sh)"
          sdk="${{ inputs.sdk_tag }}"; payload="${{ inputs.payload_tag }}"
          # A tag given by hand is not the one the checksums belong to.
          if [ -n "$sdk" ] && [ "$sdk" != "$FENIX_SDK_TAG" ]; then
            FENIX_SDK_TAG="$sdk"; FENIX_SDK_SHA256=""
          fi
          if [ -n "$payload" ] && [ "$payload" != "$FENIX_PAYLOAD_TAG" ]; then
            FENIX_PAYLOAD_TAG="$payload"; FENIX_PAYLOAD_SHA256=""
          fi
          for v in FENIX_SDK_REPO FENIX_ASSET_REPO FENIX_SDK_TAG FENIX_SDK_SHA256 \
                   FENIX_PAYLOAD_TAG FENIX_PAYLOAD_SHA256; do
            echo "$v=${!v}" >>"$GITHUB_OUTPUT"
          done
          echo "sdk $FENIX_SDK_TAG, payload $FENIX_PAYLOAD_TAG"

      - name: Cache the downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: image-dl-${{ steps.pins.outputs.FENIX_SDK_TAG }}-${{ steps.pins.outputs.FENIX_PAYLOAD_TAG }}-${{ env.GRAALVM_VERSION }}

      - name: Install GraalVM CE ${{ env.GRAALVM_VERSION }} for aarch64
        run: |
          mkdir -p dl
          f="graalvm-community-jdk-${GRAALVM_VERSION}_linux-aarch64_bin.tar.gz"
          [ -f "dl/$f" ] || curl -Lf --retry 3 -o "dl/$f" \
            "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-${GRAALVM_VERSION}/$f"
          mkdir -p graalvm && tar -C graalvm --strip-components=1 -xzf "dl/$f"
          echo "GRAALVM_HOME=$PWD/graalvm" >>"$GITHUB_ENV"
          ./graalvm/bin/native-image --version

      - name: Fetch the SDK and the payload
        if: ${{ !inputs.stub_only }}
        run: |
          set -euo pipefail
          get() { # get <repo> <tag> <file> <sha256>
            local out="dl/$2-$3"
            [ -f "$out" ] || curl -Lf --retry 3 -o "$out" \
              "https://github.com/$1/releases/download/$2/$3"
            # the check's own "OK" would otherwise land in the captured path
            [ -z "$4" ] || echo "$4  $out" | sha256sum -c - >&2
            echo "$out"
          }
          sdk=$(get "${{ steps.pins.outputs.FENIX_SDK_REPO }}" \
                    "${{ steps.pins.outputs.FENIX_SDK_TAG }}" \
                    "atl-sdk-arm64.tar.zst" "${{ steps.pins.outputs.FENIX_SDK_SHA256 }}")
          payload=$(get "${{ steps.pins.outputs.FENIX_ASSET_REPO }}" \
                    "${{ steps.pins.outputs.FENIX_PAYLOAD_TAG }}" \
                    "fenix-jvm-payload-arm64.tar.zst" "${{ steps.pins.outputs.FENIX_PAYLOAD_SHA256 }}")
          mkdir -p in/sdk in/payload
          zstd -dc "$sdk" | tar -C in/sdk -x
          zstd -dc "$payload" | tar -C in/payload -x
          test -f in/sdk/usr/lib/java/api-impl_classes.jar
          test -d in/payload/classpath
          echo "classpath: $(ls in/payload/classpath/*.jar | wc -l) jars"
          df -h /

      # The shim is the classes ART's boot class path has and a JDK lacks. The
      # jar is architecture-neutral; libportshim.so is built here too and thrown
      # away, since the image only needs the classes.
      - name: Build the compat shim
        if: ${{ !inputs.stub_only }}
        run: JAVA_HOME="$GRAALVM_HOME" ./shim/build.sh "$PWD/out"

      - name: Build the stub image
        if: ${{ inputs.stub_only }}
        run: OUTDIR="$PWD/out/image" ./image/build-image.sh --stub

      - name: Build the image
        if: ${{ !inputs.stub_only }}
        run: |
          HAX="$PWD/in/sdk/usr/lib/java/api-impl_classes.jar" \
          SHIMJAR="$PWD/out/shim.jar" \
          APPCP="$PWD/in/payload/classpath" \
          OUTDIR="$PWD/out/image" \
          ./image/build-image.sh

      # Wall clock and peak RSS are the numbers that decide whether this runner
      # can host the build at all, so they go in the summary rather than being
      # buried in a log.
      - name: Report
        if: always()
        run: |
          {
            echo "## native-image on $(uname -m)"
            echo
            echo "sdk \`${{ steps.pins.outputs.FENIX_SDK_TAG }}\`, payload \`${{ steps.pins.outputs.FENIX_PAYLOAD_TAG }}\`"
            echo
            for s in out/image/build-stats.env out/image/stub/build-stats.env; do
              [ -f "$s" ] || continue
              . "$s"
              echo "* \`$s\`: ${elapsed_s}s wall, $((peak_rss_kb / 1024)) MB peak RSS, status $status"
            done
            for so in out/image/libfenix.so out/image/stub/libatl-vm-stub.so; do
              [ -f "$so" ] || continue
              echo "* \`$so\`: $(stat -c%s "$so") bytes"
            done
            echo
            echo '<details><summary>builder tail</summary>'
            echo
            echo '```'
            tail -60 out/image/build.log 2>/dev/null || tail -60 out/image/stub/build.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-logs
          path: |
            out/image/*.log
            out/image/*.env
            out/image/*-argv.txt
            out/image/stub/*.log
            out/image/stub/*.env
          if-no-files-found: warn

      # The .so is ~150 MB and compresses to a fraction of that; the click build
      # unpacks this asset the same way it unpacks the SDK and the payload.
      - name: Package the image
        if: ${{ !inputs.stub_only }}
        run: |
          mkdir -p pkg
          cp out/image/libfenix.so pkg/
          {
            echo "sdk=${{ steps.pins.outputs.FENIX_SDK_TAG }}"
            echo "payload=${{ steps.pins.outputs.FENIX_PAYLOAD_TAG }}"
            echo "graalvm=$GRAALVM_VERSION"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >pkg/IMAGE.txt
          tar -C pkg -cf - . | zstd -19 -T0 -o fenix-image-arm64.tar.zst
          sha256sum fenix-image-arm64.tar.zst | tee fenix-image-arm64.tar.zst.sha256
          ls -l fenix-image-arm64.tar.zst

      - name: Upload the image
        if: ${{ !inputs.stub_only }}
        uses: actions/upload-artifact@v4
        with:
          name: fenix-image-arm64
          path: fenix-image-arm64.tar.zst*
          if-no-files-found: error

      - name: Publish to a GitHub release
        if: ${{ !inputs.stub_only && (inputs.publish || github.event_name == 'push') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="image-${{ steps.pins.outputs.FENIX_SDK_TAG }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" fenix-image-arm64.tar.zst fenix-image-arm64.tar.zst.sha256 --clobber
          else
            gh release create "$tag" fenix-image-arm64.tar.zst fenix-image-arm64.tar.zst.sha256 \
              --title "Fenix native image (arm64) — ${{ steps.pins.outputs.FENIX_SDK_TAG }}" \
              --prerelease \
              --notes "A GraalVM native image of Fenix's class path for aarch64, over ${{ steps.pins.outputs.FENIX_SDK_TAG }} and ${{ steps.pins.outputs.FENIX_PAYLOAD_TAG }}. Loaded by atlas's android-translation-layer-image. For testing only."
          fi
